name: manager-employee

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ApplyMigrationsOnStartup: "true"
      ConnectionStrings__ManagerEmployeeDatabase: >-
        Server=sqlserver,1433;Database=ManagerEmployee;User ID=sa;Password=${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True
      TrackTik__ApiBaseUrl: ${TRACKTIK_API_BASE_URL:?Set TRACKTIK_API_BASE_URL}
      TrackTik__TokenUrl: ${TRACKTIK_TOKEN_URL:?Set TRACKTIK_TOKEN_URL}
      TrackTik__ClientId: ${TRACKTIK_CLIENT_ID:?Set TRACKTIK_CLIENT_ID}
      TrackTik__ClientSecret: ${TRACKTIK_CLIENT_SECRET:?Set TRACKTIK_CLIENT_SECRET}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:?Set SQLSERVER_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver-data:
